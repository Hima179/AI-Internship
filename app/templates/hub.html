<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAi PsychePortal - Unified Ecosystem Hub</title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Bar Styling */
        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-circle {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e40af 0%, #0d9488 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(13, 148, 136, 0.35);
        }

        .brand-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            background: linear-gradient(to right, #38bdf8, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 1px;
        }

        /* View Mode Controls */
        .controls-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px;
            border-radius: 10px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .control-btn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.03);
        }

        .control-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, #1e40af 0%, #0d9488 100%);
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
        }

        /* Quick Links */
        .links-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quick-link-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .quick-link-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Dynamic Frames Container */
        .workspace-container {
            flex-grow: 1;
            display: flex;
            background-color: #020617;
            position: relative;
        }

        .frame-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #020617;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header inside frames */
        .frame-header {
            background: #0b0f19;
            padding: 8px 16px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .frame-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .frame-header-right a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }

        .frame-header-right a:hover {
            color: #e2e8f0;
        }

        /* Iframes */
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #ffffff;
        }

        /* Split-screen divider divider */
        .divider {
            width: 8px;
            background-color: #0b0f19;
            cursor: col-resize;
            position: relative;
            transition: background 0.2s;
        }

        .divider:hover {
            background-color: #1e293b;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 30px;
            background-color: #475569;
            border-radius: 2px;
        }

        /* States for layouts */
        .layout-split #counsellor-wrapper {
            width: 50%;
        }
        .layout-split #divider {
            display: block;
        }
        .layout-split #survey-wrapper {
            width: 50%;
        }

        .layout-counsellor #counsellor-wrapper {
            width: 100%;
        }
        .layout-counsellor #divider {
            display: none;
        }
        .layout-counsellor #survey-wrapper {
            width: 0%;
            display: none;
        }

        .layout-survey #counsellor-wrapper {
            width: 0%;
            display: none;
        }
        .layout-survey #divider {
            display: none;
        }
        .layout-survey #survey-wrapper {
            width: 100%;
        }
    </style>
</head>
<body class="layout-split">

    <header>
        <div class="brand-section">
            <div class="brand-logo-circle">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div class="brand-text">
                <h1>UAi PsychePortal</h1>
                <p>Unified Project Ecosystem Frame</p>
            </div>
        </div>

        <div class="controls-section">
            <button id="btn-split" class="control-btn active" onclick="switchLayout('split')">
                <i class="fa-solid fa-columns"></i> Split Screen
            </button>
            <button id="btn-counsellor" class="control-btn" onclick="switchLayout('counsellor')">
                <i class="fa-solid fa-user-doctor"></i> Counsellor view
            </button>
            <button id="btn-survey" class="control-btn" onclick="switchLayout('survey')">
                <i class="fa-solid fa-graduation-cap"></i> Student Assessment Room
            </button>
        </div>

        <div class="links-section">
            <a href="http://localhost:5173" target="_blank" class="quick-link-btn">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Dash Port 5173
            </a>
            <a href="http://127.0.0.1:5000/welcome" target="_blank" class="quick-link-btn">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Assessment Port 5000
            </a>
        </div>
    </header>

    <div class="workspace-container">
        <!-- Counsellor Dashboard Frame -->
        <div id="counsellor-wrapper" class="frame-wrapper">
            <div class="frame-header">
                <div class="frame-header-left">
                    <span class="status-dot"></span>
                    <span>Counsellor Insights Dashboard (React + Vite)</span>
                </div>
                <div class="frame-header-right">
                    <a href="http://localhost:5173" target="_blank"><i class="fa-solid fa-expand"></i></a>
                </div>
            </div>
            <iframe src="http://localhost:5173"></iframe>
        </div>

        <!-- Resizable Divider -->
        <div id="divider" class="divider"></div>

        <!-- Student Survey Portal Frame -->
        <div id="survey-wrapper" class="frame-wrapper">
            <div class="frame-header">
                <div class="frame-header-left">
                    <span class="status-dot"></span>
                    <span>Student Assessment Room (Flask)</span>
                </div>
                <div class="frame-header-right">
                    <a href="http://127.0.0.1:5000/welcome" target="_blank"><i class="fa-solid fa-expand"></i></a>
                </div>
            </div>
            <iframe src="http://127.0.0.1:5000/welcome"></iframe>
        </div>
    </div>

    <script>
        function switchLayout(layout) {
            // Remove active classes
            document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
            
            // Set body layout class
            document.body.className = 'layout-' + layout;
            
            // Set active button
            document.getElementById('btn-' + layout).classList.add('active');
        }
    </script>
</body>
</html>
