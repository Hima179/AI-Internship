services:
  - type: web
    name: psyche-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: psyche-db
          property: connectionString

databases:
  - name: psyche-db
    plan: free
